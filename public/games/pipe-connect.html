<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipe Flow Link</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#09101d;color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:14px;gap:12px;align-items:center;justify-content:center}
  .hud{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;background:#131d31;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;font-size:14px}
  .hud strong{color:#f59e0b}
  .grid{width:100%;max-width:380px;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  canvas.tile{width:100%;height:100%;background:#111a2e;border:1px solid rgba(255,255,255,.12);border-radius:8px;cursor:pointer}
  button{background:#f59e0b;color:#0f172a;border:0;border-radius:7px;padding:7px 14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>Moves: <strong id="mv">0</strong> · <span id="st">Link top-left to bottom-right</span></span><button id="new-btn" type="button">New Pipes</button></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const N = 5;
// Connections: [N, E, S, W]
const SHAPES = {
  straight: [1,0,1,0],
  elbow: [1,1,0,0],
  tee: [1,1,1,0],
};
let board = [], moves = 0, solved = false;
function rotMask(m, r) {
  let out = [...m];
  for (let i = 0; i < r; i++) out = [out[3], out[0], out[1], out[2]];
  return out;
}
function newLevel() {
  board = Array.from({length: N * N}, (_, i) => {
    const type = i === 0 || i === 24 ? 'elbow' : Math.random() < 0.38 ? 'straight' : Math.random() < 0.72 ? 'elbow' : 'tee';
    return { type, rot: Math.floor(Math.random() * 4), wet: false };
  });
  // Ensure a guaranteed path along outer L or stair
  [0,1,2,7,12,17,22,23,24].forEach((idx, k) => {
    board[idx].type = (idx === 0 || idx === 24 || idx === 2 || idx === 22) ? 'elbow' : 'straight';
    board[idx].rot = Math.floor(Math.random() * 4);
  });
  board[0] = { type: 'tee', rot: 1, wet: true };
  board[24] = { type: 'tee', rot: 3, wet: false };
  moves = 0; solved = false;
  document.getElementById('mv').textContent = 0;
  document.getElementById('st').textContent = 'Link top-left to bottom-right';
  flow(); render();
}
function flow() {
  board.forEach(t => t.wet = false);
  const q = [0]; board[0].wet = true;
  const opp = [2,3,0,1], dirs = [[-1,0],[0,1],[1,0],[0,-1]];
  while (q.length) {
    const i = q.shift(), r = Math.floor(i / N), c = i % N;
    const m = rotMask(SHAPES[board[i].type], board[i].rot);
    for (let d = 0; d < 4; d++) {
      if (!m[d]) continue;
      const nr = r + dirs[d][0], nc = c + dirs[d][1];
      if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
      const ni = nr * N + nc;
      const nm = rotMask(SHAPES[board[ni].type], board[ni].rot);
      if (nm[opp[d]] && !board[ni].wet) { board[ni].wet = true; q.push(ni); }
    }
  }
  if (board[24].wet) { solved = true; document.getElementById('st').textContent = 'Flow Connected!'; }
}
function render() {
  const g = document.getElementById('grid'); g.replaceChildren();
  board.forEach((t, i) => {
    const cv = document.createElement('canvas'); cv.width = 76; cv.height = 76; cv.className = 'tile';
    const x = cv.getContext('2d'), m = rotMask(SHAPES[t.type], t.rot);
    x.strokeStyle = t.wet ? '#38bdf8' : '#64748b'; x.lineWidth = 12; x.lineCap = 'round';
    x.beginPath();
    if (m[0]) { x.moveTo(38, 38); x.lineTo(38, 4); }
    if (m[1]) { x.moveTo(38, 38); x.lineTo(72, 38); }
    if (m[2]) { x.moveTo(38, 38); x.lineTo(38, 72); }
    if (m[3]) { x.moveTo(38, 38); x.lineTo(4, 38); }
    x.stroke();
    if (i === 0 || i === 24) {
      x.fillStyle = i === 0 ? '#22c55e' : '#f59e0b';
      x.beginPath(); x.arc(38, 38, 10, 0, Math.PI * 2); x.fill();
    }
    cv.addEventListener('click', () => {
      if (solved) return;
      t.rot = (t.rot + 1) % 4; moves++;
      document.getElementById('mv').textContent = moves;
      flow(); render();
    });
    g.appendChild(cv);
  });
}
document.getElementById('new-btn').addEventListener('click', newLevel);
newLevel();
</script>
</body>
</html>
