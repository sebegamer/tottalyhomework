<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Starfighter Boss Rush</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#09101d;color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px;align-items:center}
  .hud{width:100%;max-width:680px;display:flex;justify-content:space-between;background:#131d31;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;font-size:14px}
  .hud strong{color:#f59e0b}
  .stage{position:relative;flex:1;width:100%;max-width:680px;min-height:0}
  canvas{width:100%;height:100%;background:#060a14;border:1px solid rgba(255,255,255,.12);border-radius:10px}
  .ov{position:absolute;inset:0;background:rgba(6,10,20,.84);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
  .ov[hidden]{display:none}
  button{background:#f59e0b;color:#0f172a;border:0;border-radius:8px;padding:10px 22px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>Boss Stage: <strong id="st">1</strong> · Boss HP: <strong id="bhp">100</strong> · Lives: <strong id="lv">3</strong></span><span>WASD / Mouse Move · Auto-Fire</span></div>
  <div class="stage">
    <canvas id="c" width="680" height="440"></canvas>
    <div id="ov" class="ov">
      <h2 id="ov-t" style="margin:0">Starfighter Boss Rush</h2>
      <p id="ov-p" style="margin:0;color:#cbd5e1">Pilot with WASD or your mouse to weave through boss bullet spirals and shatter each dreadnought.</p>
      <button id="go" type="button">Engage Boss</button>
    </div>
  </div>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d'), ov = document.getElementById('ov');
let px = 340, py = 380, stage = 1, lives = 3, boss = {}, pb = [], eb = [], tick = 0, state = 'MENU';
const keys = {};

function spawnBoss() {
  const maxHp = 80 + stage * 45;
  boss = { x: 340, y: 78, vx: 2.2 + stage * 0.3, hp: maxHp, maxHp };
  document.getElementById('st').textContent = stage;
  document.getElementById('bhp').textContent = boss.hp;
}
function start() {
  px = 340; py = 380; stage = 1; lives = 3; pb = []; eb = []; tick = 0;
  document.getElementById('lv').textContent = 3;
  spawnBoss(); state = 'PLAY'; ov.hidden = true;
}
function loop() {
  if (state === 'PLAY') {
    tick++;
    if (keys['a'] || keys['arrowleft']) px -= 5;
    if (keys['d'] || keys['arrowright']) px += 5;
    if (keys['w'] || keys['arrowup']) py -= 5;
    if (keys['s'] || keys['arrowdown']) py += 5;
    px = Math.max(16, Math.min(c.width - 16, px)); py = Math.max(120, Math.min(c.height - 16, py));

    if (tick % 7 === 0) pb.push({ x: px, y: py - 14 });
    pb.forEach(b => b.y -= 9); pb = pb.filter(b => b.y > -10);

    boss.x += boss.vx;
    if (boss.x < 70 || boss.x > c.width - 70) boss.vx *= -1;
    if (tick % Math.max(14, 28 - stage * 2) === 0) {
      const fan = 5 + Math.min(6, stage);
      for (let i = 0; i < fan; i++) {
        const a = Math.PI * 0.25 + (i / (fan - 1)) * Math.PI * 0.5 + Math.sin(tick * 0.05) * 0.2;
        eb.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(a) * 3.4, vy: Math.sin(a) * 3.4 });
      }
    }
    eb.forEach(b => { b.x += b.vx; b.y += b.vy; });
    eb = eb.filter(b => b.x > -20 && b.x < c.width + 20 && b.y < c.height + 20);

    for (let i = pb.length - 1; i >= 0; i--) {
      if (Math.abs(pb[i].x - boss.x) < 42 && Math.abs(pb[i].y - boss.y) < 26) {
        pb.splice(i, 1); boss.hp -= 4;
        document.getElementById('bhp').textContent = Math.max(0, boss.hp);
        if (boss.hp <= 0) { stage++; spawnBoss(); break; }
      }
    }
    for (let i = eb.length - 1; i >= 0; i--) {
      if (Math.hypot(eb[i].x - px, eb[i].y - py) < 11) {
        eb.splice(i, 1); lives--; document.getElementById('lv').textContent = lives;
        if (lives <= 0) {
          state = 'OVER';
          document.getElementById('ov-t').textContent = 'Starfighter Down!';
          document.getElementById('ov-p').textContent = `Reached Boss Stage ${stage}.`;
          document.getElementById('go').textContent = 'Play Again';
          ov.hidden = false;
        }
      }
    }
  }
  ctx.fillStyle = '#060a14'; ctx.fillRect(0, 0, c.width, c.height);
  if (boss.maxHp) {
    ctx.fillStyle = '#1e293b'; ctx.fillRect(140, 16, 400, 10);
    ctx.fillStyle = '#f43f5e'; ctx.fillRect(140, 16, 400 * Math.max(0, boss.hp / boss.maxHp), 10);
    ctx.fillStyle = '#a855f7'; ctx.fillRect(boss.x - 42, boss.y - 22, 84, 44);
    ctx.fillStyle = '#f43f5e'; ctx.fillRect(boss.x - 16, boss.y - 8, 32, 16);
  }
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.moveTo(px, py - 14); ctx.lineTo(px - 12, py + 12); ctx.lineTo(px + 12, py + 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fde047'; pb.forEach(b => ctx.fillRect(b.x - 2, b.y - 8, 4, 12));
  ctx.fillStyle = '#fb7185'; eb.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill(); });
  requestAnimationFrame(loop);
}
c.addEventListener('pointermove', (e) => {
  if (state !== 'PLAY') return;
  const r = c.getBoundingClientRect();
  px = ((e.clientX - r.left)/r.width)*c.width;
  py = Math.max(120, ((e.clientY - r.top)/r.height)*c.height);
});
document.getElementById('go').addEventListener('click', start);
document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
loop();
</script>
</body>
</html>
