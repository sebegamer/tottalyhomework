<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Snake</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #09101d;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        gap: 12px;
      }
      .hud {
        width: 100%;
        max-width: 520px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: #131d31;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 10px 14px;
      }
      .stats {
        display: flex;
        gap: 18px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .stats strong { color: #f59e0b; }
      .hud-btns { display: flex; gap: 8px; }
      button {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 7px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #293548; }
      button.primary {
        background: #f59e0b;
        color: #0f172a;
        border-color: #f59e0b;
        padding: 10px 22px;
        font-size: 15px;
      }
      button.primary:hover { background: #fbbf24; }
      .stage {
        position: relative;
        flex: 1;
        width: 100%;
        max-width: 520px;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        background: #0f172a;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 1 / 1;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(9, 16, 29, 0.86);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 12px;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 26px; }
      .overlay p { margin: 0; color: #cbd5e1; font-size: 14px; max-width: 34ch; }
      .touch-pad {
        display: none;
        grid-template-columns: repeat(3, 52px);
        gap: 6px;
      }
      .touch-pad button { height: 44px; padding: 0; }
      @media (pointer: coarse), (max-width: 560px) {
        .touch-pad { display: grid; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hud">
        <div class="stats">
          <span>Score: <strong id="score">0</strong></span>
          <span>Best: <strong id="best">0</strong></span>
        </div>
        <div class="hud-btns">
          <button type="button" id="sound-btn">Sound: On</button>
          <button type="button" id="pause-btn">Pause</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="board" width="440" height="440"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlay-title">Grid Snake</h1>
          <p id="overlay-text">Use Arrow keys or WASD to steer. Collect golden apples to grow without hitting walls or your tail.</p>
          <button type="button" id="start-btn" class="primary">Start Game</button>
        </div>
      </div>

      <div class="touch-pad" aria-label="Touch controls">
        <div></div>
        <button type="button" data-dir="up">Up</button>
        <div></div>
        <button type="button" data-dir="left">Left</button>
        <button type="button" data-dir="down">Down</button>
        <button type="button" data-dir="right">Right</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayText = document.getElementById('overlay-text');
      const startBtn = document.getElementById('start-btn');
      const pauseBtn = document.getElementById('pause-btn');
      const soundBtn = document.getElementById('sound-btn');

      const GRID = 20;
      const CELL = canvas.width / GRID;
      const BEST_KEY = 'deskplay_snake_best';

      let bestScore = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = bestScore;

      let soundOn = true;
      let audioCtx = null;
      let gameState = 'TITLE_MENU';
      let snake = [];
      let dir = { x: 1, y: 0 };
      let nextDir = { x: 1, y: 0 };
      let food = { x: 12, y: 10 };
      let score = 0;
      let tickMs = 125;
      let loopTimer = null;

      function beep(freq, dur, type = 'sine') {
        if (!soundOn) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function placeFood() {
        let candidate;
        do {
          candidate = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID),
          };
        } while (snake.some((seg) => seg.x === candidate.x && seg.y === candidate.y));
        food = candidate;
      }

      function initGame() {
        snake = [
          { x: 6, y: 10 },
          { x: 5, y: 10 },
          { x: 4, y: 10 },
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        tickMs = 125;
        scoreEl.textContent = '0';
        placeFood();
        gameState = 'PLAYING';
        overlay.hidden = true;
        pauseBtn.textContent = 'Pause';
        scheduleTick();
        draw();
      }

      function scheduleTick() {
        clearTimeout(loopTimer);
        if (gameState !== 'PLAYING') return;
        loopTimer = setTimeout(() => {
          step();
          scheduleTick();
        }, tickMs);
      }

      function step() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
        const hitSelf = snake.some((seg) => seg.x === head.x && seg.y === head.y);
        if (hitWall || hitSelf) {
          gameState = 'GAME_OVER';
          beep(180, 0.25, 'sawtooth');
          overlayTitle.textContent = 'Game Over';
          overlayText.textContent = `Final score: ${score}. Press Play Again to start a fresh run.`;
          startBtn.textContent = 'Play Again';
          overlay.hidden = false;
          draw();
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = String(score);
          if (score > bestScore) {
            bestScore = score;
            bestEl.textContent = String(bestScore);
            localStorage.setItem(BEST_KEY, String(bestScore));
          }
          tickMs = Math.max(68, 125 - Math.floor(score / 30) * 6);
          beep(620, 0.08, 'triangle');
          placeFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
          const pad = 2;
          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
          ctx.fill();
        });
      }

      function setDirection(dx, dy) {
        if (gameState !== 'PLAYING') return;
        if (dx === -dir.x && dy === -dir.y) return;
        nextDir = { x: dx, y: dy };
      }

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
          e.preventDefault();
        }
        if (key === 'arrowup' || key === 'w') setDirection(0, -1);
        else if (key === 'arrowdown' || key === 's') setDirection(0, 1);
        else if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
        else if (key === 'arrowright' || key === 'd') setDirection(1, 0);
        else if (key === 'p') togglePause();
      });

      document.querySelectorAll('[data-dir]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const d = btn.dataset.dir;
          if (d === 'up') setDirection(0, -1);
          if (d === 'down') setDirection(0, 1);
          if (d === 'left') setDirection(-1, 0);
          if (d === 'right') setDirection(1, 0);
        });
      });

      function togglePause() {
        if (gameState === 'PLAYING') {
          gameState = 'PAUSED';
          clearTimeout(loopTimer);
          pauseBtn.textContent = 'Resume';
          overlayTitle.textContent = 'Paused';
          overlayText.textContent = 'Press Resume or P to continue.';
          startBtn.textContent = 'Resume';
          overlay.hidden = false;
        } else if (gameState === 'PAUSED') {
          gameState = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.hidden = true;
          scheduleTick();
        }
      }

      startBtn.addEventListener('click', () => {
        if (gameState === 'PAUSED') togglePause();
        else initGame();
      });

      pauseBtn.addEventListener('click', togglePause);
      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
      });

      draw();
    </script>
  </body>
</html>
