<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Falling Sand Lab</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#09101d;color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px;align-items:center}
  .bar{width:100%;max-width:740px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;background:#131d31;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  button{background:#1e293b;color:#f8fafc;border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer}
  button.active{background:#f59e0b;color:#0f172a;border-color:#f59e0b}
  canvas{flex:1;width:100%;max-width:740px;min-height:0;background:#0b1120;border:1px solid rgba(255,255,255,.12);border-radius:10px;image-rendering:pixelated;cursor:crosshair}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="row" id="elems"></div>
    <div class="row">
      <button id="size-btn" type="button">Brush: 3</button>
      <button id="clear-btn" type="button">Clear</button>
    </div>
  </div>
  <canvas id="c" width="150" height="96"></canvas>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const EMPTY=0, SAND=1, WATER=2, STONE=3, WOOD=4, FIRE=5, ACID=6;
const COLORS = {
  [EMPTY]: [11, 17, 32],
  [SAND]: [245, 194, 66],
  [WATER]: [56, 189, 248],
  [STONE]: [100, 116, 139],
  [WOOD]: [133, 77, 14],
  [FIRE]: [249, 115, 22],
  [ACID]: [163, 230, 53],
};
const BTNS = [
  { id: SAND, name: 'Sand' },
  { id: WATER, name: 'Water' },
  { id: STONE, name: 'Stone' },
  { id: WOOD, name: 'Wood' },
  { id: FIRE, name: 'Fire' },
  { id: ACID, name: 'Acid' },
  { id: EMPTY, name: 'Erase' },
];
let grid = new Uint8Array(W * H);
let selected = SAND, brush = 3, down = false, mx = 0, my = 0;

const elems = document.getElementById('elems');
BTNS.forEach((b) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = b.name;
  if (b.id === selected) btn.classList.add('active');
  btn.addEventListener('click', () => {
    selected = b.id;
    Array.from(elems.children).forEach((el, i) => el.classList.toggle('active', BTNS[i].id === selected));
  });
  elems.appendChild(btn);
});

const idx = (x, y) => y * W + x;
const inB = (x, y) => x >= 0 && x < W && y >= 0 && y < H;

function paint(cx, cy) {
  for (let dy = -brush; dy <= brush; dy++) {
    for (let dx = -brush; dx <= brush; dx++) {
      if (dx * dx + dy * dy <= brush * brush) {
        const x = cx + dx, y = cy + dy;
        if (inB(x, y) && (selected === STONE || selected === WOOD || selected === EMPTY || Math.random() < 0.7)) {
          grid[idx(x, y)] = selected;
        }
      }
    }
  }
}

function step() {
  if (down) paint(mx, my);
  const moved = new Uint8Array(W * H);
  const swap = (x1, y1, x2, y2) => {
    const i1 = idx(x1, y1), i2 = idx(x2, y2);
    const t = grid[i1]; grid[i1] = grid[i2]; grid[i2] = t;
    moved[i1] = 1; moved[i2] = 1;
  };
  for (let y = H - 1; y >= 0; y--) {
    const leftFirst = Math.random() < 0.5;
    for (let i = 0; i < W; i++) {
      const x = leftFirst ? i : W - 1 - i;
      const p = idx(x, y);
      if (moved[p]) continue;
      const t = grid[p];
      if (t === SAND) {
        if (y + 1 < H && (grid[idx(x, y + 1)] === EMPTY || grid[idx(x, y + 1)] === WATER)) swap(x, y, x, y + 1);
        else {
          const d = Math.random() < 0.5 ? -1 : 1;
          if (inB(x + d, y + 1) && (grid[idx(x + d, y + 1)] === EMPTY || grid[idx(x + d, y + 1)] === WATER)) swap(x, y, x + d, y + 1);
        }
      } else if (t === WATER) {
        if (y + 1 < H && grid[idx(x, y + 1)] === EMPTY) swap(x, y, x, y + 1);
        else {
          const d = Math.random() < 0.5 ? -1 : 1;
          if (inB(x + d, y + 1) && grid[idx(x + d, y + 1)] === EMPTY) swap(x, y, x + d, y + 1);
          else if (inB(x + d, y) && grid[idx(x + d, y)] === EMPTY) swap(x, y, x + d, y);
        }
      } else if (t === FIRE) {
        if (Math.random() < 0.08) { grid[p] = EMPTY; continue; }
        for (const [ox, oy] of [[0,-1],[1,0],[-1,0],[0,1]]) {
          if (inB(x + ox, y + oy)) {
            const np = idx(x + ox, y + oy);
            if (grid[np] === WOOD && Math.random() < 0.14) grid[np] = FIRE;
            if (grid[np] === WATER) { grid[p] = EMPTY; break; }
          }
        }
        if (grid[p] === FIRE && y > 0 && grid[idx(x, y - 1)] === EMPTY && Math.random() < 0.5) swap(x, y, x, y - 1);
      } else if (t === ACID) {
        for (const [ox, oy] of [[0,1],[1,0],[-1,0]]) {
          if (inB(x + ox, y + oy)) {
            const np = idx(x + ox, y + oy);
            if (grid[np] !== EMPTY && grid[np] !== ACID && grid[np] !== STONE && Math.random() < 0.12) {
              grid[np] = EMPTY; grid[p] = EMPTY; break;
            }
          }
        }
        if (grid[p] === ACID && y + 1 < H && grid[idx(x, y + 1)] === EMPTY) swap(x, y, x, y + 1);
        else if (grid[p] === ACID) {
          const d = Math.random() < 0.5 ? -1 : 1;
          if (inB(x + d, y) && grid[idx(x + d, y)] === EMPTY) swap(x, y, x + d, y);
        }
      }
    }
  }
}

const img = ctx.createImageData(W, H);
function render() {
  step();
  for (let i = 0; i < grid.length; i++) {
    const c = COLORS[grid[i]];
    const o = i * 4;
    const j = grid[i] === FIRE ? (Math.random() * 40 - 20) : 0;
    img.data[o] = Math.min(255, Math.max(0, c[0] + j));
    img.data[o + 1] = Math.min(255, Math.max(0, c[1] + j));
    img.data[o + 2] = c[2];
    img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  requestAnimationFrame(render);
}

function updatePos(e) {
  const r = canvas.getBoundingClientRect();
  mx = Math.floor(((e.clientX - r.left) / r.width) * W);
  my = Math.floor(((e.clientY - r.top) / r.height) * H);
}
canvas.addEventListener('pointerdown', (e) => { down = true; updatePos(e); });
window.addEventListener('pointerup', () => { down = false; });
canvas.addEventListener('pointermove', updatePos);
document.getElementById('size-btn').addEventListener('click', (e) => {
  brush = brush === 3 ? 6 : brush === 6 ? 1 : 3;
  e.target.textContent = `Brush: ${brush}`;
});
document.getElementById('clear-btn').addEventListener('click', () => { grid.fill(0); });
render();
</script>
</body>
</html>
