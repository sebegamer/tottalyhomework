<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hex Base Defense</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#09101d;color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px;align-items:center}
  .hud{width:100%;max-width:720px;display:flex;justify-content:space-between;background:#131d31;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;font-size:14px}
  .hud strong{color:#f59e0b}
  .stage{position:relative;flex:1;width:100%;max-width:720px;min-height:0}
  canvas{width:100%;height:100%;background:#060a14;border:1px solid rgba(255,255,255,.12);border-radius:10px;cursor:crosshair}
  .ov{position:absolute;inset:0;background:rgba(6,10,20,.84);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
  .ov[hidden]{display:none}
  button{background:#f59e0b;color:#0f172a;border:0;border-radius:8px;padding:10px 22px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>Score: <strong id="sc">0</strong> · Base HP: <strong id="hp">100</strong>%</span><span>Move Mouse to Aim · Auto-Fires Laser Bolts</span></div>
  <div class="stage">
    <canvas id="c" width="720" height="440"></canvas>
    <div id="ov" class="ov">
      <h2 id="ov-t" style="margin:0">Hex Base Defense</h2>
      <p id="ov-p" style="margin:0;color:#cbd5e1">Aim your center turret with the mouse or finger to blast incoming drones before they hit the core.</p>
      <button id="go" type="button">Activate Turret</button>
    </div>
  </div>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d'), ov = document.getElementById('ov');
let mx = 500, my = 220, hp = 100, score = 0, bolts = [], drones = [], tick = 0, state = 'MENU';

function start() {
  hp = 100; score = 0; bolts = []; drones = []; tick = 0;
  document.getElementById('sc').textContent = 0; document.getElementById('hp').textContent = 100;
  state = 'PLAY'; ov.hidden = true;
}
function loop() {
  if (state === 'PLAY') {
    tick++;
    const ang = Math.atan2(my - 220, mx - 360);
    if (tick % 8 === 0) bolts.push({ x: 360 + Math.cos(ang)*22, y: 220 + Math.sin(ang)*22, vx: Math.cos(ang)*9, vy: Math.sin(ang)*9 });
    if (tick % Math.max(16, 42 - Math.floor(score / 40)) === 0) {
      const a = Math.random() * Math.PI * 2, dist = 420;
      const sx = 360 + Math.cos(a) * dist, sy = 220 + Math.sin(a) * dist;
      const spd = 1.6 + Math.min(2.6, score / 220);
      drones.push({ x: sx, y: sy, vx: -Math.cos(a) * spd, vy: -Math.sin(a) * spd });
    }
    bolts.forEach(b => { b.x += b.vx; b.y += b.vy; });
    bolts = bolts.filter(b => b.x > 0 && b.x < c.width && b.y > 0 && b.y < c.height);
    for (let i = drones.length - 1; i >= 0; i--) {
      const d = drones[i]; d.x += d.vx; d.y += d.vy;
      if (Math.hypot(d.x - 360, d.y - 220) < 26) {
        drones.splice(i, 1); hp = Math.max(0, hp - 15);
        document.getElementById('hp').textContent = hp;
        if (hp <= 0) {
          state = 'OVER';
          document.getElementById('ov-t').textContent = 'Core Destroyed!';
          document.getElementById('ov-p').textContent = `Final Score: ${score}`;
          document.getElementById('go').textContent = 'Defend Again';
          ov.hidden = false;
        }
        continue;
      }
      const hb = bolts.findIndex(b => Math.hypot(b.x - d.x, b.y - d.y) < 15);
      if (hb !== -1) {
        bolts.splice(hb, 1); drones.splice(i, 1);
        score += 10; document.getElementById('sc').textContent = score;
      }
    }
  }
  ctx.fillStyle = '#060a14'; ctx.fillRect(0, 0, c.width, c.height);
  const ang = Math.atan2(my - 220, mx - 360);
  ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(360, 220, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(360, 220); ctx.lineTo(360 + Math.cos(ang)*30, 220 + Math.sin(ang)*30); ctx.stroke();
  ctx.fillStyle = '#fde047'; bolts.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
  ctx.fillStyle = '#f43f5e'; drones.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI*2); ctx.fill(); });
  requestAnimationFrame(loop);
}
c.addEventListener('pointermove', (e) => { const r = c.getBoundingClientRect(); mx = ((e.clientX - r.left)/r.width)*c.width; my = ((e.clientY - r.top)/r.height)*c.height; });
document.getElementById('go').addEventListener('click', start);
loop();
</script>
</body>
</html>
