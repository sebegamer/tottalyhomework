<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circuit Lights Out</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#09101d;color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:14px;gap:14px;align-items:center;justify-content:center}
  .hud{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;background:#131d31;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;font-size:14px}
  .hud strong{color:#f59e0b}
  .grid{width:100%;max-width:380px;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .cell{border-radius:12px;background:#111a2e;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background-color 140ms,box-shadow 140ms}
  .cell.on{background:#f59e0b;box-shadow:0 0 18px rgba(245,158,11,.45);border-color:#fde047}
  button.go{background:#1e293b;color:#f8fafc;border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:7px 12px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>Moves: <strong id="mv">0</strong> · <span id="st">Turn all lights off</span></span>
    <button id="new-btn" class="go" type="button">New Puzzle</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const N = 5;
let lights = Array(25).fill(false), moves = 0, solved = false;
const gridEl = document.getElementById('grid');

function toggleIdx(i) {
  const r = Math.floor(i / N), c = i % N;
  [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr, dc]) => {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < N && nc >= 0 && nc < N) lights[nr * N + nc] = !lights[nr * N + nc];
  });
}

function newPuzzle() {
  lights.fill(false); moves = 0; solved = false;
  for (let k = 0; k < 10; k++) toggleIdx(Math.floor(Math.random() * 25));
  if (lights.every(v => !v)) toggleIdx(12);
  document.getElementById('mv').textContent = 0;
  document.getElementById('st').textContent = 'Turn all lights off';
  render();
}

function render() {
  gridEl.replaceChildren();
  lights.forEach((on, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell' + (on ? ' on' : '');
    b.addEventListener('click', () => {
      if (solved) return;
      toggleIdx(i); moves++;
      document.getElementById('mv').textContent = moves;
      if (lights.every(v => !v)) { solved = true; document.getElementById('st').textContent = 'Cleared!'; }
      render();
    });
    gridEl.appendChild(b);
  });
}
document.getElementById('new-btn').addEventListener('click', newPuzzle);
newPuzzle();
</script>
</body>
</html>
