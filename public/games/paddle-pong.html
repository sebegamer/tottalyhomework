<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Rally Pong</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#09101d;color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px;align-items:center}
  .hud{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;background:#131d31;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;font-size:14px}
  .hud strong{color:#f59e0b}
  button{background:#1e293b;color:#f8fafc;border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  canvas{flex:1;width:100%;max-width:720px;min-height:0;background:#070c17;border:1px solid rgba(255,255,255,.12);border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>You: <strong id="p1">0</strong> · CPU: <strong id="p2">0</strong> · Rally: <strong id="ral">0</strong></span>
    <div style="display:flex;gap:8px">
      <button id="mode-btn" type="button">Mode: 1P vs CPU</button>
      <button id="rst-btn" type="button">Reset</button>
    </div>
  </div>
  <canvas id="c" width="720" height="440"></canvas>
</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let twoPlayer = false, p1 = 175, p2 = 175, s1 = 0, s2 = 0, rally = 0;
let bx = 360, by = 220, vx = 5.2, vy = 3.2;
const keys = {};

function serve(dir = 1) {
  bx = 360; by = 220; rally = 0;
  vx = 5.2 * dir; vy = (Math.random() < 0.5 ? 1 : -1) * (2.5 + Math.random() * 2);
  document.getElementById('ral').textContent = 0;
}
function loop() {
  if (keys['w'] || (!twoPlayer && keys['arrowup'])) p1 -= 6.5;
  if (keys['s'] || (!twoPlayer && keys['arrowdown'])) p1 += 6.5;
  p1 = Math.max(0, Math.min(c.height - 90, p1));

  if (twoPlayer) {
    if (keys['arrowup']) p2 -= 6.5;
    if (keys['arrowdown']) p2 += 6.5;
  } else {
    const target = by - 45;
    p2 += Math.sign(target - p2) * Math.min(4.7, Math.abs(target - p2));
  }
  p2 = Math.max(0, Math.min(c.height - 90, p2));

  bx += vx; by += vy;
  if (by < 8 || by > c.height - 8) { vy = -vy; by = Math.max(8, Math.min(c.height - 8, by)); }

  if (bx < 30 && bx > 14 && by > p1 && by < p1 + 90 && vx < 0) {
    vx = Math.min(11.5, Math.abs(vx) * 1.05);
    vy += ((by - (p1 + 45)) / 45) * 3.5;
    rally++; document.getElementById('ral').textContent = rally;
  }
  if (bx > c.width - 30 && bx < c.width - 14 && by > p2 && by < p2 + 90 && vx > 0) {
    vx = -Math.min(11.5, Math.abs(vx) * 1.05);
    vy += ((by - (p2 + 45)) / 45) * 3.5;
    rally++; document.getElementById('ral').textContent = rally;
  }

  if (bx < 0) { s2++; document.getElementById('p2').textContent = s2; serve(1); }
  if (bx > c.width) { s1++; document.getElementById('p1').textContent = s1; serve(-1); }

  ctx.fillStyle = '#070c17'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.setLineDash([8, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.moveTo(360, 0); ctx.lineTo(360, c.height); ctx.stroke(); ctx.setLineDash([]);

  ctx.fillStyle = '#38bdf8'; ctx.fillRect(18, p1, 12, 90);
  ctx.fillStyle = '#f43f5e'; ctx.fillRect(c.width - 30, p2, 12, 90);
  ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fill();
  requestAnimationFrame(loop);
}
c.addEventListener('pointermove', (e) => {
  const r = c.getBoundingClientRect();
  p1 = ((e.clientY - r.top) / r.height) * c.height - 45;
  p1 = Math.max(0, Math.min(c.height - 90, p1));
});
document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
document.getElementById('mode-btn').addEventListener('click', (e) => {
  twoPlayer = !twoPlayer;
  e.target.textContent = twoPlayer ? 'Mode: 2P (W/S vs Up/Down)' : 'Mode: 1P vs CPU';
});
document.getElementById('rst-btn').addEventListener('click', () => { s1 = 0; s2 = 0; document.getElementById('p1').textContent = 0; document.getElementById('p2').textContent = 0; serve(1); });
loop();
</script>
</body>
</html>
