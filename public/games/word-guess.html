<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Five-Letter Wordle</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#09101d;color:#f8fafc;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:10px;gap:10px;align-items:center;justify-content:space-between}
  .hud{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;background:#131d31;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;font-size:13px}
  .board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:100%;max-width:290px}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .cell{aspect-ratio:1/1;border:1px solid rgba(255,255,255,.18);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;text-transform:uppercase;background:#0f172a}
  .cell.g{background:#16a34a;border-color:#22c55e}
  .cell.y{background:#d97706;border-color:#f59e0b}
  .cell.x{background:#334155;border-color:#475569}
  .kbd{display:flex;flex-direction:column;gap:5px;width:100%;max-width:440px}
  .krow{display:flex;justify-content:center;gap:4px}
  button.k{min-width:28px;flex:1;height:36px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:#1e293b;color:#f8fafc;font-weight:700;font-size:12px;cursor:pointer;padding:0 4px}
  button.k.g{background:#16a34a} button.k.y{background:#d97706} button.k.x{background:#334155;color:#94a3b8}
  button.new{background:#f59e0b;color:#0f172a;border:0;border-radius:7px;padding:6px 12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span id="msg">Guess the 5-letter word</span><button id="new-btn" class="new" type="button">New Word</button></div>
  <div class="board" id="board"></div>
  <div class="kbd" id="kbd"></div>
</div>
<script>
const WORDS = ['CRISP','BLAZE','SOLAR','SPARK','QUEST','PIXEL','ORBIT','FROST','STONE','CRAFT','LOGIC','TIMER','PRIME','TRAIL','SWIFT','PULSE','CLOUD','LASER','FRAME','GHOST','SHARD','FLAME','GLIDE','DELTA','PRISM','BRAIN','SCOPE','STAGE','BADGE','LEVEL'];
const ROWS_K = ['QWERTYUIOP','ASDFGHJKL','>ZXCVBNM<'];
let target = '', guesses = [], cur = '', over = false, keyStates = {};

function newGame() {
  target = WORDS[Math.floor(Math.random() * WORDS.length)];
  guesses = []; cur = ''; over = false; keyStates = {};
  document.getElementById('msg').textContent = 'Guess the 5-letter word';
  render();
}
function scoreRow(g) {
  const res = Array(5).fill('x'), t = target.split('');
  for (let i = 0; i < 5; i++) if (g[i] === t[i]) { res[i] = 'g'; t[i] = ''; }
  for (let i = 0; i < 5; i++) if (res[i] === 'x') {
    const idx = t.indexOf(g[i]);
    if (idx !== -1) { res[i] = 'y'; t[idx] = ''; }
  }
  return res;
}
function press(ch) {
  if (over) return;
  if (ch === '<') { cur = cur.slice(0, -1); render(); return; }
  if (ch === '>') {
    if (cur.length !== 5) return;
    const sc = scoreRow(cur);
    cur.split('').forEach((l, i) => {
      const rank = { g: 3, y: 2, x: 1 };
      if ((rank[sc[i]] || 0) > (rank[keyStates[l]] || 0)) keyStates[l] = sc[i];
    });
    guesses.push({ word: cur, sc });
    if (cur === target) { over = true; document.getElementById('msg').textContent = `Solved in ${guesses.length}/6!`; }
    else if (guesses.length === 6) { over = true; document.getElementById('msg').textContent = `Word was ${target}`; }
    cur = ''; render(); return;
  }
  if (/^[A-Z]$/.test(ch) && cur.length < 5) { cur += ch; render(); }
}
function render() {
  const b = document.getElementById('board'); b.replaceChildren();
  for (let r = 0; r < 6; r++) {
    const row = document.createElement('div'); row.className = 'row';
    const g = guesses[r];
    const word = g ? g.word : (r === guesses.length ? cur : '');
    for (let c = 0; c < 5; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (g ? ' ' + g.sc[c] : '');
      cell.textContent = word[c] || '';
      row.appendChild(cell);
    }
    b.appendChild(row);
  }
  const k = document.getElementById('kbd'); k.replaceChildren();
  ROWS_K.forEach(rk => {
    const kr = document.createElement('div'); kr.className = 'krow';
    rk.split('').forEach(ch => {
      const btn = document.createElement('button'); btn.type = 'button';
      btn.className = 'k' + (keyStates[ch] ? ' ' + keyStates[ch] : '');
      btn.textContent = ch === '>' ? 'ENT' : ch === '<' ? 'DEL' : ch;
      btn.addEventListener('click', () => press(ch));
      kr.appendChild(btn);
    });
    k.appendChild(kr);
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') press('>');
  else if (e.key === 'Backspace') press('<');
  else if (/^[a-zA-Z]$/.test(e.key)) press(e.key.toUpperCase());
});
document.getElementById('new-btn').addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
