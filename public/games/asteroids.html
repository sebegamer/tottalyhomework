<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroids Drift</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #09101d;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 16px;
        gap: 12px;
      }
      .hud {
        width: 100%;
        max-width: 720px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #131d31;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 10px 14px;
      }
      .stats {
        display: flex;
        gap: 18px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .stats strong { color: #f59e0b; }
      button {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 7px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #293548; }
      button.primary {
        background: #f59e0b;
        color: #0f172a;
        border-color: #f59e0b;
        padding: 10px 22px;
        font-size: 15px;
      }
      .stage {
        position: relative;
        flex: 1;
        width: 100%;
        max-width: 720px;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        background: #060b16;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 16 / 10;
        display: block;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(6, 11, 22, 0.86);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 12px;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 26px; }
      .overlay p { margin: 0; color: #cbd5e1; font-size: 14px; max-width: 38ch; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hud">
        <div class="stats">
          <span>Score: <strong id="score">0</strong></span>
          <span>Wave: <strong id="wave">1</strong></span>
          <span>Lives: <strong id="lives">3</strong></span>
        </div>
        <div>
          <button type="button" id="sound-btn">Sound: On</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="space" width="720" height="450"></canvas>
        <div id="overlay" class="overlay">
          <h1 id="overlay-title">Asteroids Drift</h1>
          <p id="overlay-text">Left/Right arrows rotate, Up thrusts, and Spacebar fires. Clear every asteroid wave.</p>
          <button type="button" id="start-btn" class="primary">Start Game</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('space');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const waveEl = document.getElementById('wave');
      const livesEl = document.getElementById('lives');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayText = document.getElementById('overlay-text');
      const startBtn = document.getElementById('start-btn');
      const soundBtn = document.getElementById('sound-btn');

      let soundOn = true;
      let audioCtx = null;
      let gameState = 'TITLE_MENU';
      let score = 0;
      let wave = 1;
      let lives = 3;
      let rafId = null;
      let bullets = [];
      let asteroids = [];
      let fireCooldown = 0;
      const keys = {};

      const ship = { x: 360, y: 225, vx: 0, vy: 0, angle: -Math.PI / 2, invuln: 0 };

      function beep(freq, dur, type = 'triangle') {
        if (!soundOn) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function makeAsteroid(x, y, radius) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * (1.2 + wave * 0.25);
        const verts = 8 + Math.floor(Math.random() * 4);
        const offsets = Array.from({ length: verts }, () => 0.78 + Math.random() * 0.35);
        return {
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: radius,
          offsets,
        };
      }

      function spawnWave(count) {
        asteroids = [];
        for (let i = 0; i < count; i++) {
          let x, y;
          do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
          } while (Math.hypot(x - ship.x, y - ship.y) < 120);
          asteroids.push(makeAsteroid(x, y, 36));
        }
      }

      function startNewGame() {
        score = 0;
        wave = 1;
        lives = 3;
        bullets = [];
        ship.x = canvas.width / 2;
        ship.y = canvas.height / 2;
        ship.vx = 0;
        ship.vy = 0;
        ship.angle = -Math.PI / 2;
        ship.invuln = 90;
        scoreEl.textContent = '0';
        waveEl.textContent = '1';
        livesEl.textContent = '3';
        spawnWave(4);
        gameState = 'PLAYING';
        overlay.hidden = true;
        cancelAnimationFrame(rafId);
        loop();
      }

      function wrap(obj) {
        if (obj.x < 0) obj.x += canvas.width;
        if (obj.x > canvas.width) obj.x -= canvas.width;
        if (obj.y < 0) obj.y += canvas.height;
        if (obj.y > canvas.height) obj.y -= canvas.height;
      }

      function update() {
        if (keys['ArrowLeft'] || keys['a']) ship.angle -= 0.065;
        if (keys['ArrowRight'] || keys['d']) ship.angle += 0.065;
        if (keys['ArrowUp'] || keys['w']) {
          ship.vx += Math.cos(ship.angle) * 0.16;
          ship.vy += Math.sin(ship.angle) * 0.16;
        }

        ship.vx *= 0.99;
        ship.vy *= 0.99;
        ship.x += ship.vx;
        ship.y += ship.vy;
        wrap(ship);
        if (ship.invuln > 0) ship.invuln--;

        if (fireCooldown > 0) fireCooldown--;
        if (keys[' '] && fireCooldown === 0) {
          bullets.push({
            x: ship.x + Math.cos(ship.angle) * 14,
            y: ship.y + Math.sin(ship.angle) * 14,
            vx: Math.cos(ship.angle) * 7.5 + ship.vx * 0.4,
            vy: Math.sin(ship.angle) * 7.5 + ship.vy * 0.4,
            life: 52,
          });
          fireCooldown = 12;
          beep(720, 0.05);
        }

        bullets = bullets.filter((b) => {
          b.x += b.vx;
          b.y += b.vy;
          b.life--;
          wrap(b);
          return b.life > 0;
        });

        for (const a of asteroids) {
          a.x += a.vx;
          a.y += a.vy;
          wrap(a);
        }

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          for (let ai = asteroids.length - 1; ai >= 0; ai--) {
            const a = asteroids[ai];
            if (Math.hypot(b.x - a.x, b.y - a.y) < a.r) {
              bullets.splice(bi, 1);
              asteroids.splice(ai, 1);
              score += a.r > 24 ? 20 : a.r > 14 ? 40 : 60;
              scoreEl.textContent = String(score);
              beep(240, 0.1, 'sawtooth');
              if (a.r > 16) {
                asteroids.push(makeAsteroid(a.x, a.y, a.r * 0.56));
                asteroids.push(makeAsteroid(a.x, a.y, a.r * 0.56));
              }
              break;
            }
          }
        }

        if (ship.invuln === 0) {
          for (const a of asteroids) {
            if (Math.hypot(ship.x - a.x, ship.y - a.y) < a.r + 10) {
              lives -= 1;
              livesEl.textContent = String(lives);
              beep(140, 0.25, 'sawtooth');
              if (lives <= 0) {
                gameState = 'GAME_OVER';
                overlayTitle.textContent = 'Ship Lost';
                overlayText.textContent = `Final score: ${score} on wave ${wave}.`;
                startBtn.textContent = 'Play Again';
                overlay.hidden = false;
                return;
              }
              ship.x = canvas.width / 2;
              ship.y = canvas.height / 2;
              ship.vx = 0;
              ship.vy = 0;
              ship.invuln = 110;
              break;
            }
          }
        }

        if (asteroids.length === 0) {
          wave += 1;
          waveEl.textContent = String(wave);
          spawnWave(3 + wave);
          beep(520, 0.15);
        }
      }

      function draw() {
        ctx.fillStyle = '#060b16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.75;
        for (const a of asteroids) {
          ctx.beginPath();
          a.offsets.forEach((off, i) => {
            const ang = (i / a.offsets.length) * Math.PI * 2;
            const px = a.x + Math.cos(ang) * a.r * off;
            const py = a.y + Math.sin(ang) * a.r * off;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.stroke();
        }

        ctx.fillStyle = '#f59e0b';
        for (const b of bullets) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        if (ship.invuln % 8 < 5) {
          ctx.save();
          ctx.translate(ship.x, ship.y);
          ctx.rotate(ship.angle);
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(15, 0);
          ctx.lineTo(-11, 9);
          ctx.lineTo(-7, 0);
          ctx.lineTo(-11, -9);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }
      }

      function loop() {
        if (gameState !== 'PLAYING') return;
        update();
        draw();
        if (gameState === 'PLAYING') {
          rafId = requestAnimationFrame(loop);
        }
      }

      document.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
          e.preventDefault();
        }
        keys[e.key] = true;
        keys[e.key.toLowerCase()] = true;
      });

      document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
        keys[e.key.toLowerCase()] = false;
      });

      startBtn.addEventListener('click', startNewGame);
      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
      });

      spawnWave(4);
      draw();
    </script>
  </body>
</html>
